<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- Fonts and fetches stay on this origin: the drawing editor's CDN font
     fallback (esm.sh) is unreachable. -->
<meta http-equiv="Content-Security-Policy" content="font-src 'self' data:; connect-src 'self' data: blob:">
<title>__APP__</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/static/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png" sizes="180x180">
<style>
  :root {
    --mobile-shell-height: 97px;
    /* Spec: operator 2026-10-15 requests 90% desktop text; phones stay unchanged. */
    font-size: 90%;
  }
  * { box-sizing: border-box; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0);
    white-space: nowrap; border: 0; }
  html, body { width: 100%; height: 100%; min-height: 0; margin: 0; overflow: hidden; }
  @supports (height: 100dvh) {
    html, body { height: 100dvh; }
  }
  body {
    background: var(--bg); color: var(--text);
    font: 0.9375rem/1.6 var(--font-sans);
    display: flex; overscroll-behavior: none;
  }

  /* ---------- sidebar: agent forest ---------- */
  #sidebar {
    width: 400px; flex: none; background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; position: relative;
  }
  #brand { display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-5) var(--space-5) var(--space-3); }
  #brand, .backend-heading strong { font-weight: 600; font-size: 0.84375rem; color: var(--text); }
  .backend-heading strong { color: color-mix(in srgb, var(--text) 70%, var(--muted)); }
  #brand img { width: 24px; height: 24px; flex: none; }

  #agent-list { flex: 1; min-width: 0; min-height: 0; max-width: 100%;
    overflow-x: hidden; overflow-y: scroll; overscroll-behavior-y: contain;
    overflow-anchor: none; padding: 0 var(--space-3) var(--space-4);
    /* Reserve a themed track without widening the sidebar. Disabling scroll
       anchoring makes keyed status/title/count polls preserve the operator's
       exact position even when metadata above the viewport wraps differently. */
    scrollbar-gutter: stable; scrollbar-width: thin;
    scrollbar-color: var(--muted) transparent; }
  .backend-section hr { border: 0; border-top: 1px solid var(--border); margin: var(--space-2) 0 0; }
  .backend-heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-3); padding: var(--space-3); color: var(--muted); }
  .backend-status { font-size: 0.65625rem; }
  .backend-section-header { display: flex; align-items: center; }
  .backend-section-header .backend-heading { flex: 1; min-width: 0; }
  .backend-new-agent { position: relative; z-index: var(--z-raised); margin-block: calc(-1 * var(--space-3)); }
  .backend-new-agent:disabled { cursor: default; opacity: .45; }
  .backend-heading a, .backend-settings { color: var(--accent); }
  .backend-settings { background: none; border: 0; font: inherit; cursor: pointer; text-align: start; }
  .remote-read-only :is(#safety-row, #model-row, #trash-btn, #takeover-btn) {
    opacity: .45; cursor: not-allowed; }
  #agent-list::-webkit-scrollbar { width: 10px; }
  #agent-list::-webkit-scrollbar-track { background: transparent; }
  #agent-list::-webkit-scrollbar-thumb { background: var(--muted);
    border-radius: 6px; border: 2px solid var(--panel); }
  #agent-list::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }
  .agent { padding: var(--space-2) var(--space-3); margin: 1px 0; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent;
    /* keep vertical list scrolling native, but hand horizontal swipes to JS
       (swipe-to-dismiss) so preventDefault there doesn't fight the scroll */
    touch-action: pan-y;
    /* a row is a tap/long-press/swipe target, never text: stop Android from
       firing its text-selection + callout menu on the long-press-to-rename hold */
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  /* the inline rename field is real editable text — let it select/caret again */
  .agent .rename-input { -webkit-user-select: text; user-select: text; }
  /* mid-swipe: the row follows the finger with no transition lag */
  .agent.swiping { transition: none; will-change: transform, opacity; }
  /* swiped far enough that releasing will dismiss it — flag it red, like .armed */
  .agent.dismiss-armed { background: color-mix(in srgb, var(--danger) 14%, transparent); border-color: var(--danger); }
  .agent.dismiss-armed .title { color: var(--danger); }
  .agent:hover { background: var(--panel-2); }
  .agent.selected { background: var(--panel-2); border-color: var(--border-strong); }
  .agent.cursor { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: -2px; }
  /* Spec: compact sidebar overrides apply only on phones. */
  @media (max-width: 700px) {
  :root { font-size: 100%; }
  #agent-list .agent { min-height: 32px; padding: var(--space-1) var(--space-3);
    display: flex; flex-direction: column; justify-content: center; }
  #agent-list .agent .title { font-size: 0.9375rem; line-height: 24px; }
  #agent-list .agent.selected:not(.dismiss-armed, .armed, .drop-ok, .drop-bad, .drag-source) { border-color: transparent;
    background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
  #agent-list .agent.cursor:not(.dismiss-armed, .armed, .drop-ok, .drop-bad, .drag-source) { border-color: transparent;
    outline-width: 1px; outline-offset: -1px; }
  #sidebar #brand { padding: var(--space-3) var(--space-5); gap: var(--space-3); }
  #brand, .backend-heading strong { font-size: 0.9375rem; }
  #agent-list .agent .agent-state { width: 12px; min-width: 12px; height: 12px; }
  #agent-list .agent .kids { padding-block: 0; }
  }
  /* Re-parent drag: the source is dashed, legal destinations are outlined, and
     an invalid drop target is flagged red. */
  .agent.drag-source { opacity: .6; border-style: dashed;
    border-color: var(--accent-dim); }
  .agent.drop-ok { border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .agent.drop-bad { border-color: var(--danger);
    background: color-mix(in srgb, var(--danger) 12%, transparent); cursor: no-drop; }
  .agent .row1 { display: flex; align-items: center; gap: var(--space-2); min-width: 0;
    flex-wrap: wrap; }
  /* A compact colored, shaped marker for each state — no spelled-out word, so
     it stays small on a phone. The shape (filled dot, hollow ring, square,
     diamond) carries the state alongside color, so it never relies on color
     alone; the full state name lives in the row's tooltip and assistive label.
     Fixed size keeps titles from jumping sideways as polls change state. */
  .agent .agent-state { width: 14px; min-width: 14px; height: 14px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); }
  .agent .state-mark { width: 10px; height: 10px; flex: none; border-radius: 50%;
    border: 1px solid currentColor; background: currentColor; }
  .agent .agent-state.running, .agent .agent-state.working {
    color: var(--running-strong); }
  .agent .agent-state.running .state-mark, .agent .agent-state.working .state-mark {
    animation: pulse 1.2s infinite; }
  .agent .agent-state.working .state-mark { background: transparent; border-width: 2px; }
  /* Waiting: the agent's own turn settled but background work continues —
     a hollow green ring with a centered dot, deliberately static while the
     live-turn states pulse, so a parked branch never reads as active. */
  .agent .agent-state.waiting { color: var(--running-strong); }
  .agent .agent-state.waiting .state-mark { background:
    radial-gradient(circle, currentColor 1.5px, transparent 1.7px);
    border-width: 1.5px; }
  .agent .agent-state.idle .state-mark { width: 8px; height: 8px;
    border-width: 1.5px; background: transparent; }
  /* Taken over: the operator holds this agent. A yellow open ring; dashed
     so it never reads as the solid yellow interrupted ring, and slightly
     larger so the dashes resolve at a glance. */
  .agent .agent-state.taken-over { color: var(--warn); }
  .agent .agent-state.taken-over .state-mark { background: transparent;
    border-width: 2px; border-style: dashed; width: 10px; height: 10px; }
  .agent .agent-state.stopping { color: var(--warn); }
  .agent .agent-state.stopping .state-mark { border-radius: 1px; } /* radius-check: allow a status mark */
  .agent .agent-state.interrupted { color: var(--warn); }
  .agent .agent-state.interrupted .state-mark { background: transparent; border-width: 2px; }
  .agent .agent-state.error { color: var(--danger); }
  .agent .agent-state.error .state-mark { border-radius: 1px; transform: rotate(45deg); } /* radius-check: allow a status mark */
  .agent .agent-state.unknown .state-mark { background: transparent; border-style: dotted; }
  .agent .agent-state.draft .state-mark { background: transparent; border-style: dashed; }
  @keyframes pulse { 50% { opacity: .6; } }
  @media (prefers-reduced-motion: reduce) {
    .agent .agent-state.running .state-mark,
    .agent .agent-state.working .state-mark { animation: none; }
  }
  @media (forced-colors: active) {
    .agent .agent-state.running .state-mark,
    .agent .agent-state.working .state-mark { animation: none; }
    /* Gradients flatten in forced colors: keep the waiting dot painted so
       waiting never collapses into working. */
    .agent .agent-state.waiting .state-mark { forced-color-adjust: none; }
  }
  .agent .title { flex: 1; min-width: 32px; font-size: 0.84375rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* inline rename: the title turns into this field in place (F2 or long-press) */
  .agent .rename-input { flex: 1; min-width: 0; font-family: inherit;
    font-size: 0.84375rem; font-weight: 600; color: var(--text);
    background: var(--panel); border: 1px solid var(--accent);
    border-radius: 6px; padding: 1px var(--space-2);
    margin: calc(-1 * var(--space-1)) 0; outline: none; }
  .agent .kids, .agent .queue-badge { max-width: 100%; overflow: hidden; }
  .agent .agent-model { flex: none; max-width: 45%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; font-size: 0.65625rem;
    color: var(--muted); }
  /* the person glyph marking a subagent count ("3 👤") */
  .pico { width: 9px; height: 9px; flex: none; }
  .message-icon { width: 10px; height: 10px; flex: none; }
  .agent .time { flex: none; font-size: 0.65625rem; color: var(--text-faint); }
  .agent .takeover-tag { flex: none; display: inline-flex; align-items: center;
    color: var(--warn); }
  .agent .safety-off-tag { flex: none; display: inline-flex; align-items: center;
    color: var(--danger); }
  @media (prefers-reduced-motion: reduce) {
    .agent .status.running { animation: none; }
  }
  /* armed for delete: modifier-X pressed once, awaiting the confirming second */
  .agent.armed, .agent.armed:hover { background: color-mix(in srgb, var(--danger) 14%, transparent);
    border-color: var(--danger); }
  .agent.armed .title { color: var(--danger); }
  #conv-title.armed, #conv-title.stop-armed { color: var(--danger); }

  /* Rolling/cached asset compatibility only: an older sidebar bundle may still
     append this removed hover-summary node. Keep it inert, including its .on state. */
  #agent-tip, #agent-tip.on { display: none !important; }

  #sidebar-foot { padding: var(--space-3) var(--space-5) var(--space-4); border-top: 1px solid var(--border);
    font-size: 0.65625rem; color: var(--muted); }
  #shortcut-pane > summary { cursor: pointer; color: var(--text); font-size: 0.71875rem;
    font-weight: 600; list-style-position: inside; }
  #shortcut-pane[open] > summary { margin-bottom: var(--space-3); }
  #sidebar-foot .shortcut-group + .shortcut-group { margin-top: var(--space-3); }
  #sidebar-foot .shortcut-title { color: var(--text); font-size: 0.65625rem;
    font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: var(--space-1); }
  #sidebar-foot .keys { display: flex; flex-wrap: wrap;
    gap: var(--space-2) var(--space-4); }
  #sidebar-foot .k { display: inline-flex; align-items: center; gap: var(--space-2);
    white-space: nowrap; }
  #sidebar-foot kbd { font-family: inherit; font-size: 0.65625rem; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--border);
    border-bottom-color: var(--kbd-edge); border-radius: 6px; padding: 1px var(--space-2);
    line-height: 1.4; }
  #sidebar-foot .note { margin-top: var(--space-3); padding-top: var(--space-3);
    border-top: 1px solid var(--border); line-height: 1.6; }
  #settings-btn { display: flex; align-items: center; gap: var(--space-3); width: 100%;
    background: none; border: 0; border-top: 1px solid var(--border);
    color: var(--muted); font-family: inherit; font-size: 0.78125rem; cursor: pointer;
    padding: var(--space-4) var(--space-5); text-align: left; }
  #settings-btn:hover { color: var(--accent); }
  #settings-btn svg { flex: none; }

  /* ---------- main pane ---------- */
  #main { flex: 1; min-width: 0; min-height: 0; height: 100%;
    display: flex; flex-direction: column; overflow: hidden; }
  #topbar { height: 48px; flex: none; min-width: 0; display: flex; align-items: center;
    position: relative; z-index: auto; padding: 0 var(--space-5);
    font-weight: 600; font-size: 0.84375rem; gap: var(--space-2); background: var(--bg); }
  #menu-btn { display: inline-flex; min-width: 44px; min-height: 44px; background: none;
    border: 0; color: var(--text); cursor: pointer; padding: var(--space-2) var(--space-3);
    margin-left: calc(-1 * var(--space-3)); align-items: center; justify-content: center; }
  #menu-btn svg { width: 20px; height: 20px; }
  #menu-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* up-to-parent affordance: shown when the selected agent has a routing parent
     open, the visible twin of the phone's back button */
  #up-btn { display: none; background: none; border: 0; color: var(--muted);
    cursor: pointer; padding: var(--space-2) var(--space-3);
    margin-left: calc(-1 * var(--space-2)); line-height: 0; }
  #up-btn.on { display: flex; }
  #up-btn:hover { color: var(--accent); }
  #up-top { display: none; flex: none; width: 44px; height: 44px;
    padding: 0; border: 0; border-radius: 8px; background: none;
    color: var(--text); align-items: center; justify-content: center; cursor: pointer; }
  #up-top.on { display: inline-flex; }
  #up-top:hover { background: var(--panel); }
  #up-top:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #topbar .spacer { flex: 1; }
  #top-actions { flex: none; }
  /* The title takes the remaining width without moving actions onto a new row. */
  #conv-titlebar { position: relative; display: flex; flex: 1; align-items: center; gap: var(--space-3); min-width: 0; }
  #conv-title { flex: 1; min-height: 44px; line-height: 44px; }
  #sidebar.desktop-hidden { display: none; }
  #key-mode { display: inline-flex; align-items: center; min-height: 22px;
    color: var(--muted); border: 1px solid var(--border); border-radius: 999px;
    padding: 1px var(--space-3); font: 600 0.65625rem/1.2 var(--font-mono);
    white-space: nowrap; transition: color var(--motion-fast), border-color var(--motion-fast), background var(--motion-fast); }
  #key-mode.pending { color: var(--accent); border-color: var(--accent-dim);
    background: color-mix(in srgb, var(--accent) 8%, transparent); }
  #key-mode.danger { color: var(--danger); border-color: var(--danger);
    background: color-mix(in srgb, var(--danger) 8%, transparent); }
  @media (pointer: coarse) { #key-mode { display: none; } }
  #top-actions { display: flex; align-items: center; gap: var(--space-1); }
  #top-actions.prefix-on .top-act[data-key-hint]:not(:disabled) { color: var(--accent);
    background: color-mix(in srgb, var(--accent) 8%, transparent); outline: 1px solid var(--accent-dim); }
  #top-actions.prefix-on .top-act[data-key-hint]::after { content: attr(data-key-hint);
    display: inline-flex; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--accent-dim); border-radius: 6px; padding: 1px var(--space-2);
    font: 600 0.65625rem/1.2 var(--font-mono); }
  .top-act { display: inline-flex; align-items: center; gap: var(--space-2);
    background: none; border: 0; color: var(--muted); cursor: pointer;
    padding: var(--space-2) var(--space-3); border-radius: 8px;
    font: 600 0.78125rem/1 var(--font-sans);
    /* the press-slide gesture must not select text, pop the touch callout, or be
       stolen by the browser as a scroll when you slide down onto the menu */
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none; }
  .top-act:hover { color: var(--accent); background: var(--panel); }
  .top-act:disabled { color: var(--text-disabled); cursor: default; background: none; }
  #new-top { min-width: 44px; min-height: 44px; justify-content: center;
    color: var(--text); }
  .top-act svg { flex: none; }
  .top-act .lbl { line-height: 1; white-space: nowrap; }

  /* Conversation actions keep their availability/confirmation classes inside
     the overflow; app.css supplies the full-width menu-item geometry. */
  #takeover-btn, #trash-btn { display: none; flex: none;
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); cursor: pointer;
    align-items: center; justify-content: center; padding: 0; }
  #takeover-btn.on { display: inline-flex; }
  #takeover-btn:disabled.on { cursor: wait; opacity: .65; }
  #share-link-btn[hidden], #new-top[hidden], .backend-new-agent[hidden] { display: none; }
#trash-btn:hover { color: var(--danger); border-color: var(--danger); }
  /* armed: one tap in, awaiting the confirming second tap — red like #conv-title.armed */
  #trash-btn.armed { color: var(--danger); border-color: var(--danger);
    background: color-mix(in srgb, var(--danger) 14%, transparent); }
  /* Hold-to-confirm tooltip for Stop. One
     hidden div per button, fixed-positioned so showing it never shifts
     layout, shown and hidden instantly — no transitions, so nothing animates
     under prefers-reduced-motion. Visual only (aria-hidden); the buttons'
     own titles and labels carry the meaning. */
  .hold-tip { display: none; position: fixed; z-index: var(--z-toast);
    padding: var(--space-3) var(--space-4);
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 0.78125rem;
    line-height: 1.35; white-space: normal; width: max-content;
    max-width: min(360px, calc(100vw - 24px));
    overflow: hidden; pointer-events: none; }
  .hold-tip.on { display: block; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  #conv-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* the title doubles as a "copy this agent's id" control for a real agent */
  #conv-title.copyable { cursor: pointer; }
  #conv-title.copyable:hover { text-decoration: underline dotted; text-underline-offset: 3px; }
  #conv-title.copied { color: var(--accent); }
  /* transient "Copied ID" pill; announced politely for screen readers */
  #title-copied { display: none; flex: none; font-size: 0.65625rem; font-weight: 600;
    color: var(--accent); border: 1px solid var(--accent-dim); border-radius: 999px;
    padding: 1px var(--space-3); white-space: nowrap; pointer-events: none; }
  #title-copied.on { display: inline-block; }
  .chip { font-size: 0.65625rem; font-weight: 600; padding: var(--space-1) var(--space-3);
    border-radius: 999px;
    display: none; white-space: nowrap; flex: none; }
  .chip.on { display: inline-block; }
  /* the working indicator: a green dot before the title, matching the sidebar
     status dot; only shown while a turn is running */
  #conv-status { width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--running); display: none; }
  #conv-status.running { display: inline-block; animation: pulse 1.2s infinite; }
  /* subagent count "N 👤" pill, mirroring the sidebar .kids badge */
  #chip-kids:not(.on), #chip-queued:not(.on), #chip-state:not(.on) { display: none; }
  #chip-kids.on, #chip-queued.on, #chip-state.on { display: inline-flex; }
  /* the last-turn state: a round warn badge holding one alert icon */
  #chip-state { width: 18px; padding: 0; }
  /* Refresh dots occupy a fixed slot below the title, never a gap between
     controls. Showing them and pulsing opacity cannot move the header. */
  #conv-freshness { position: absolute; left: 0; bottom: 2px;
    display: inline-flex; align-items: center;
    gap: var(--space-1); height: 4px; visibility: hidden; }
  #conv-freshness.on { visibility: visible; }
  #conv-freshness i { width: 4px; height: 4px; border-radius: 50%;
    background: var(--muted); animation: freshness-dot 1.2s infinite; }
  #conv-freshness i:nth-of-type(2) { animation-delay: .2s; }
  #conv-freshness i:nth-of-type(3) { animation-delay: .4s; }
  @keyframes freshness-dot { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #conv-freshness i { animation: none; opacity: .6; }
  }
  @media (forced-colors: active) { #conv-freshness i { animation: none; } }

  /* Global connection status floats below the topbar, so appearing after a
     minute never shifts the cached thread, composer, or mobile title controls. */
  #connection-status { position: fixed; z-index: var(--z-dialog); top: 56px; right: 14px;
    display: none; align-items: center; gap: var(--space-3); max-width: calc(100vw - 28px);
    padding: var(--space-2) var(--space-3); border: 1px solid var(--danger);
    border-left-width: 3px; border-radius: 10px; background: var(--panel-2);
    color: var(--text); box-shadow: var(--expanded-lift);
    font-size: 0.71875rem; line-height: 1.2; font-weight: 600; }
  #connection-status.on { display: flex; }
  #connection-status[data-state="offline"],
  #connection-status[data-state="auth-expired"] { border-color: var(--warn); }
  #connection-status .connection-symbol { color: var(--danger); font-size: 0.84375rem; }
  #connection-status[data-state="offline"] .connection-symbol,
  #connection-status[data-state="auth-expired"] .connection-symbol { color: var(--warn); }
  #connection-status .connection-label { overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #connection-status button { white-space: nowrap; }
  #connection-status button:disabled { cursor: wait; }

  /* ---------- settings page ----------
     A registry of sections renders into #settings-sections (see the JS): every
     entry inherits this styling, so adding a setting is one settingsSection()
     call with no new CSS. Full page: category nav on the left, the selected
     category's sections on the right; auth sections show live login state. */
  #settings-overlay { display: none; position: fixed; inset: 0; z-index: calc(var(--z-dialog) + 2);

    /* One row, with full-size touch targets; pane chrome still measures this

    #topbar { height: calc(48px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) var(--space-3) 0; gap: var(--space-2); z-index: calc(var(--z-drawer) + 4); }
    #key-mode { display: none; }
    #conv-titlebar { gap: var(--space-2); }
    #top-actions.prefix-on .top-act::after { position: absolute; transform: translateY(24px); }
    .top-act { position: relative; }
    #conv-title { font-size: 0.9375rem; }
    #sidebar.desktop-hidden { display: flex; }
    /* Keep the context measurement attached to the picker on a phone. The pair
       wraps together rather than squeezing safety or overlapping the composer. */
    #conv-controls { column-gap: var(--space-2); }
    #conv-controls #safety-row { margin: 0; padding: 0; min-width: 0; }
    #conv-controls #model-controls { margin-block: 0; margin-inline-start: auto;
      margin-inline-end: 0; padding: 0; max-width: 100%; }
    #conv-controls #model-row { width: 100%; min-width: 0; max-width: none; }
    #context-mini { display: none; }
    #model-menu { width: min(300px, calc(100vw - 24px)); }
    #model-trigger { max-width: min(240px, calc(100vw - 120px)); }
    #context-overlay { align-items: flex-end; padding: 0; }
    #context-surface { width: 100%; max-width: none; max-height: calc(100dvh - var(--mobile-shell-height));
      border-radius: 14px 14px 0 0; border-bottom: 0; }
    .context-surface-head { padding-left: var(--space-5); }
    #context-body { padding: 0 var(--space-5) max(var(--space-5), env(safe-area-inset-bottom)); }
    .context-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    /* Keep response footers to two lines on a phone without changing their
       disclosure controls or their touch target size. */
    :is(.msg.assistant, .activity-body):has(> .turn-foot) { --turn-button-size: 22px; --turn-button-gap: var(--space-2); }
    .turn-foot { gap: var(--space-2); font-size: 0.71875rem; line-height: 1.35; }
    .turn-foot .turn-summary { display: -webkit-box; overflow: hidden;
      -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
    /* A crowded phone panel shrinks the chip font instead of pushing the
       label out of the pill. */
    .live-panel-box .shell-chip, .live-panel-box .agent-chip { font-size: 0.65625rem; }
    .turn-expand svg, .turn-tokens svg { width: 12px; height: 12px; }
    .tc-call-head { padding-left: var(--space-3); padding-right: var(--space-3); }
    .tool-detail-body { padding-left: var(--space-3); padding-right: var(--space-3); }
    .tool-payload pre, .prompt-block .tool-payload pre { max-height: 36vh; }
    #connection-status { top: var(--mobile-shell-height);
      right: max(8px, env(safe-area-inset-right)); }
    /* Clear the measured single-row header. */
    #thread-loading { top: var(--mobile-shell-height); }
    #composer-wrap { padding-top: var(--space-2);
      padding-bottom: max(var(--space-3), env(safe-area-inset-bottom)); }
    #agent-finder { max-height: min(420px, 58vh); }
    #agent-finder, #skill-menu { position: fixed; top: var(--mobile-shell-height);
      bottom: auto; left: var(--space-5); right: var(--space-5);
      max-height: calc(100dvh - var(--mobile-shell-height) - 14px); z-index: var(--z-menu); }
    #agent-list { padding-bottom: max(var(--space-4), env(safe-area-inset-bottom)); }
    .table-scroll { max-width: 100%; overflow-x: auto; }
    .table-scroll table { width: max-content; min-width: 100%; overflow-wrap: normal; }
    .table-scroll th, .table-scroll td { white-space: nowrap; }
    #agent-finder-query { min-height: 44px; }
    #shell-overlay { inset: var(--mobile-shell-height) 0 0; padding: var(--space-3);
      align-items: flex-start; justify-content: stretch; }
    .shell-surface { width: 100%; max-width: none;
      max-height: calc(100dvh - var(--mobile-shell-height) - 112px);
      padding: var(--space-5); border-radius: 14px; }
  }
  @media (pointer: coarse) {
    /* Panel chips keep their 18 px badge height in the panel. Their
       transparent pseudo-elements provide 44 px targets without changing the
       panel layout; each target stays in its chip's horizontal slot, so the
       adjacent shell and agent targets do not overlap. */
    .live-panel-box { overflow-x: clip; overflow-y: visible; }
    .live-panel-box .shell-chip, .live-panel-box .agent-chip {
      position: relative; z-index: var(--z-raised);
    }
    .live-panel-box .shell-chip::before,
    .live-panel-box .agent-chip::before {
      content: ""; position: absolute; z-index: 0;
      top: 50%; left: 50%; width: max(100%, 44px); height: 44px;
      transform: translate(-50%, -50%);
    }
    .agent-message-row, .turn-series-toggle,
    button.turn-series-summary.hidden-chunk { min-height: 44px; }
    .activity-group-body .agent-message-row,
    .activity-group-body .turn-series-toggle { min-height: 0; }
    .pending-agent-toggle { min-width: 44px; min-height: 44px; }
    #context-indicator { min-height: 44px; }
    #menu-btn { min-width: 44px; min-height: 44px; }
    #agent-list { scrollbar-width: auto; }
    #agent-list::-webkit-scrollbar { width: 14px; }
  }

  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 6px;
    border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>

<link rel="stylesheet" href="/static/app.css?v=__VERSION__">
<style id="theme">__THEME__</style>
<link rel="stylesheet" href="/static/katex.css?v=__VERSION__">
</head>
<body data-version="__VERSION__">

<aside id="sidebar" tabindex="-1">
  <div id="brand"><img src="/static/brand/mark.svg" width="24" height="24" alt="">__APP__</div>
  <nav id="agent-list" aria-label="Agent tree" role="tree"></nav>
  <div id="sidebar-foot">
    <details id="shortcut-pane">
      <summary>Keyboard shortcuts</summary>
      <div id="shortcut-groups"></div>
    </details>
  </div>
  <button id="settings-btn" title="Settings">
    <svg data-icon="SETTINGS_ICON"></svg>
    <span>Settings</span>
  </button>
</aside>
<div id="backdrop"></div>

<div id="settings-overlay">
  <div id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <header class="settings-head">
      <h2 id="settings-title">Settings</h2>
      <select id="settings-backend" class="text-field sm" aria-label="Recurse these settings change" hidden></select>
      <span id="settings-release" title="Recurse release and commit" hidden></span>
      <button class="icon-btn lg" id="settings-close" title="Close"
        aria-label="Close settings"><svg data-icon="CLOSE_ICON"></svg></button>
    </header>
    <div class="settings-cols">
      <nav id="settings-nav" aria-label="Settings categories"></nav>
      <div id="settings-sections"></div>
    </div>
  </div>
</div>

<!-- The "no hidden prompts" inspector: the full prompt the model sees for an
     agent (system prompt + operator digest), opened from a message's eye button
     or the top-of-thread hidden-context banner. Filled by prompt.ts. -->
<div id="prompt-overlay">
  <div id="prompt-modal" class="dialog" role="dialog" aria-modal="true" aria-labelledby="prompt-title">
    <div class="prompt-modal-head"><h2 id="prompt-title">Message details</h2>
      <button class="icon-btn lg" id="prompt-close"
      type="button" title="Close" aria-label="Close message inspector"><svg data-icon="CLOSE_ICON"></svg></button></div>
    <div id="prompt-body"></div>
  </div>
</div>

<!-- Counts-only context detail is fetched for the selected owner only when this
     dialog opens. It never contains prompt, message, or tool payload text. -->
<div id="context-overlay" hidden>
  <section id="context-surface" class="dialog" role="dialog" aria-modal="true"
    aria-labelledby="context-title">
    <div class="context-surface-head">
      <h2 id="context-title">Context window</h2>
      <button id="context-close" class="icon-btn lg" type="button" title="Close"
        aria-label="Close context details"><svg data-icon="CLOSE_ICON"></svg></button>
    </div>
    <div id="context-body"></div>
  </section>
</div>

<!-- Live background-shell details are rendered here only while the selected
     agent's compact shell chip is open. Keeping this outside the thread avoids
     pushing the composer or leaving command cards in the closed layout. -->
<div id="shell-overlay"></div>

<main id="main">
  <div id="connection-status" data-state="connecting">
    <span class="connection-symbol" aria-hidden="true">!</span>
    <span class="connection-label">Disconnected</span>
    <button class="btn sm" type="button">Retry now</button>
  </div>
  <span id="connection-announcement" class="sr-only" role="status"
    aria-live="polite" aria-atomic="true"></span>
  <span id="tree-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></span>
  <div id="topbar">
    <button id="menu-btn" type="button" title="Open agent list" aria-label="Open agent list"
      aria-controls="sidebar" aria-expanded="false"><svg data-icon="MENU_ICON"></svg></button>
    <div id="conv-titlebar">
      <button id="up-top" title="Up to parent agent" aria-label="Up to parent agent"></button>
      <span class="status" id="conv-status" title="Working"></span>
      <!-- Refresh dots have a fixed slot below the title. -->
      <span id="conv-freshness" role="status" aria-live="polite">
        <i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i>
        <span class="sr-only"></span>
      </span>
      <span id="conv-title">Agents</span>
      <span id="title-copied" aria-live="polite">Copied ID</span>
      <span class="chip badge accent" id="chip-kids"></span>
      <span class="chip badge warn" id="chip-queued" role="img">
        <span class="queue-count" aria-hidden="true"></span>
        <svg data-icon="MESSAGE_ICON"></svg>
      </span>
      <span class="chip badge warn" id="chip-state" role="img"><svg data-icon="ALERT_ICON"></svg></span>
    </div>
    <span id="key-mode" role="status" aria-live="polite">Normal</span>
    <div id="top-actions" role="group" aria-label="Agent actions">
      <button class="top-act" id="new-top" title="New top-level agent" data-key-hint="tt">
        <span class="lbl">New</span>
      </button>
      <button id="pane-fab" title="More actions" aria-label="More actions" aria-haspopup="menu"
        aria-controls="pane-menu" aria-expanded="false">
      </button>
    </div>
  </div>
  <div id="shared-tree-status" class="menu-note" role="status" hidden></div>
  <div id="share-link-status" class="menu-note" role="status" hidden></div>
  <!-- Shown while opening an agent whose thread hasn't been read yet: the
       previous agent's messages stay on screen, dimmed and inert, purely so the
       page doesn't blink empty. Fixed, like #connection-status, so appearing
       never moves the thread. -->
  <div id="thread-loading" role="status" aria-live="polite"></div>
  <div id="scroll"><div id="messages"></div></div>
  <div id="composer-wrap">
    <button id="scroll-btn" aria-label="Scroll to latest">
      <svg data-icon="SCROLL_DOWN_ICON"></svg>
    </button>
    <!-- Safety and model choice share one aligned row when space permits. On a
         very narrow screen they wrap in this same accessible reading order. -->
    <div id="conv-controls">
      <div id="safety-row">
        <button id="safety-btn" type="button" role="switch" aria-checked="true"
          title="Review each action for safety before it runs"
          aria-label="Safety review, on">
          <span class="track"><span class="knob"></span></span>
          <span class="lbl">Safety review</span>
          <span id="safety-unavailable" role="status" hidden>Unavailable</span>
        </button>
      </div>
      <button id="downgrade-chip" type="button" popovertarget="downgrade-popover" hidden><svg data-icon="DOWNGRADE_ICON"></svg>Downgraded</button>
      <div id="downgrade-popover" class="menu form" popover="auto" role="dialog" aria-label="Provider model downgrade"></div>
      <div id="model-controls">
        <button id="context-indicator" type="button" aria-haspopup="dialog"
          aria-controls="context-surface" aria-expanded="false" disabled>
          <span id="context-mini" aria-hidden="true"></span>
          <span id="context-token-label"></span>
        </button>
        <div id="model-row">
          <button id="model-trigger" type="button" popovertarget="model-menu" aria-keyshortcuts="e Shift+M"
            aria-expanded="false" title="Choose effort level (e or Shift+M)" aria-label="Choose effort level"><span class="model-name"></span><svg data-icon="CHEVRON_UP_ICON"></svg></button>
          <div id="model-menu" class="menu form" popover="auto" tabindex="-1" role="dialog" aria-label="Effort level">
            <div id="effort-slider">
              <input id="effort-range" type="range" min="1" max="5" step="1" value="3" aria-label="Effort level">
              <span id="effort-value" aria-hidden="true"></span>
            </div>
            <p id="effort-model" role="status" aria-live="polite"></p>
            <p id="effort-current" hidden></p>
          </div>
        </div>
      </div>
    </div>
    <div id="attachments"></div>
    <div id="composer-shell">
      <div id="agent-finder" class="menu" data-agent-finder role="group" aria-label="Agent finder">
        <label class="sr-only" for="agent-finder-query">Find an agent</label>
        <input id="agent-finder-query" class="text-field" type="text" role="combobox" placeholder="Find an agent…"
          maxlength="96" aria-autocomplete="list" aria-controls="agent-menu"
          aria-expanded="false" hidden>
        <div id="agent-menu" role="listbox" aria-label="Agents"></div>
        <div id="agent-finder-status" class="menu-note" role="status" aria-live="polite" hidden></div>
      </div>
      <div id="composer" class="composer-box">
        <div id="skill-menu" class="menu" role="listbox" aria-label="Commands and skills"></div>
        <input id="file-input" type="file" multiple hidden>
        <button id="attach" title="Attach file">
        <svg data-icon="ATTACH_ICON"></svg>
      </button>
        <textarea id="input" rows="1" maxlength="100000" autocomplete="off" placeholder="Message this agent…" class="composer-input"
          aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false"></textarea>
        <button id="send" class="composer-send" title="Send" disabled>
          <svg data-icon="SEND_ICON"></svg>
        </button>
      </div>
    </div>
    <button id="send-status" type="button" aria-live="polite" disabled></button>
    <div id="update-status" aria-live="polite"></div>
  </div>
</main>

<!-- side panels: feature views that open to the right of the chat. The rail
     shows one button per available panel; everything here stays hidden until a
     panel is registered and offered for the open agent. -->
<div id="panes"></div>
<div id="pane-rail"><div id="pane-rail-panels"></div></div>
<div id="pane-menu" class="menu" role="menu" aria-label="Conversation actions and panels">
  <button id="share-link-btn" class="menu-item pane-menu-item" role="menuitem" hidden>Share link</button>
  <button id="trash-btn" class="menu-item pane-menu-item" role="menuitem">
    <span class="action-label">Delete</span>
  </button>
  <button id="takeover-btn" class="menu-item pane-menu-item" role="menuitem" title="Take over" aria-label="Take over" aria-pressed="false">
    <span>Take control</span>
  </button>
  <div id="pane-menu-panels" role="none"></div>
  <button id="up-btn" class="menu-item pane-menu-item" role="menuitem" title="Up to parent agent">Up to parent agent</button>
</div>
<div id="pane-backdrop"></div>
<div id="pane-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<script type="importmap">{"imports":{"/static/app.js":"/static/app.js?v=__VERSION__"}}</script>
<script type="module" src="/static/app.js?v=__VERSION__"></script>
