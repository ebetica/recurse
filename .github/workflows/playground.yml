name: Playground

on:
  push:
    branches: [main]
    paths: ["playground/**"]

jobs:
  modal:
    if: github.repository != 'ebetica/recurse'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install the pinned deployment SDK
        run: python3 -m pip install modal==1.5.1

      - name: Test the Modal deployment
        run: python3 playground/modal/test_deploy.py
